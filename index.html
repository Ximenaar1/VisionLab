<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VisiónLab · Aprende cómo ven las computadoras</title>
  <meta name="description" content="Recurso educativo para aprender, paso a paso y jugando, cómo funciona el reconocimiento de imágenes con inteligencia artificial.">
  <meta name="theme-color" content="#2F80ED">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icono-192.png">
  <link rel="apple-touch-icon" href="icono-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main id="app" aria-live="polite">
    <div id="cargando-inicial" style="text-align:center;padding:80px 16px;font-family:system-ui,sans-serif;color:#1F4E79">
      <p style="font-size:2.5rem;margin:0">🤖</p>
      <p style="font-weight:700">Cargando VisiónLab…</p>
    </div>
  </main>

  <nav id="nav" class="nav" hidden aria-label="Menú principal">
    <button data-ir="camino"><span>🗺️</span>Camino</button>
    <button data-ir="diccionario"><span>📖</span>Diccionario</button>
    <button data-ir="logros"><span>🏅</span>Logros</button>
    <button data-ir="perfil"><span>👤</span>Perfil</button>
  </nav>

  <!-- Diagnóstico: si algo falla al arrancar, se muestra un mensaje en lugar de una pantalla en blanco -->
  <script>
    function vlMostrarError(msg) {
      var app = document.getElementById('app');
      if (!app) return;
      app.innerHTML = '<div style="max-width:520px;margin:60px auto;padding:20px;border:2px solid #EB5757;border-radius:16px;background:#FDECEC;font-family:system-ui,sans-serif;color:#1C2430">' +
        '<p style="font-size:2rem;margin:0">🤖⚠️</p><h2 style="margin:8px 0">VisiónLab no pudo arrancar</h2><p>' + msg + '</p>' +
        '<p style="font-size:.85rem;color:#5B6675">Toma captura de este mensaje para revisarlo.</p></div>';
    }
    window.addEventListener('error', function (e) {
      if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
        var src = e.target.src || e.target.href || '';
        if (src.indexOf(location.host) !== -1 && !window.vlIniciada) vlMostrarError('No se encontró el archivo <b>' + src.split('/').slice(-2).join('/') + '</b>. Revisa que subiste todos los archivos de la carpeta.');
      } else if (e.message && !window.vlIniciada) {
        vlMostrarError('Error de JavaScript: <code>' + e.message + '</code>');
      }
    }, true);
    window.addEventListener('load', function () {
      setTimeout(function () {
        if (document.getElementById('cargando-inicial')) vlMostrarError('Los archivos de la app no se cargaron. Revisa que en tu repositorio estén todos los archivos (index.html, estilos.css, app.js, datos.js, ia.js, pixi.js).');
      }, 4000);
    });
  </script>

  <!-- Inteligencia artificial: TensorFlow.js + MobileNet v2 -->
  <script defer src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
  <!-- VisiónLab -->
  <script defer src="datos.js"></script>
  <script defer src="pixi.js"></script>
  <script defer src="ia.js"></script>
  <script defer src="app.js"></script>
</body>
</html>
